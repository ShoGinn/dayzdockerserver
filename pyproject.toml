[project]
dependencies = [
    "fastapi>=0.126.0",
    "pydantic>=2.12.5",
    "python-multipart>=0.0.31",
    "requests>=2.34.0",
    "uvicorn[standard]>=0.52.1",
]
description = "DayZ Server Management API and Lifecycle Tools"
name = "dayz-server"
readme = "README.md"
requires-python = ">=3.12"
version = "2.0.0"

[dependency-groups]
dev = [
    "httpx2>=1.0.0",
    "pytest>=9.0.3",
    "ruff>=0.14.10",
    "ty==0.0.70",
    "types-requests>=2.32.4.20260107",
]

[tool.ruff]
extend-exclude = ["tests/typing_fixtures"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "E501", # line too long (handled by formatter)
]
select = [
    "ANN", # flake8-annotations
    "A",   # flake8-builtins
    "B",   # flake8-bugbear (find likely bugs)
    "C4",  # flake8-comprehensions
    "E",
    "F",
    "I",   # Flake8 errors, flakes, warnings, and isort
    "PGH003", # require specific type-ignore codes
    "PYI", # typing stub and annotation best practices
    "SIM", # flake8-simplify
    "UP",  # pyupgrade rules (modernize code)
    "W",
]
preview = true

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "error"

[tool.ty.src]
include = ["src"]

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
