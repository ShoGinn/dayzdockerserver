version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: America/New_York
    groups:
      frontend-dependencies:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "06:00"
      timezone: America/New_York
    ignore:
      # Track the active LTS line. Review Node major upgrades once the next
      # even-numbered release has entered LTS.
      - dependency-name: node
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: thursday
      time: "06:00"
      timezone: America/New_York
    groups:
      github-actions:
        patterns:
          - "*"
