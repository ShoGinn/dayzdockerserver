name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.12.5
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run ty check src
      - name: Verify strict ty diagnostics
        run: |
          if uv run ty check tests/typing_fixtures/invalid.py >ty-fixture.log 2>&1; then
            echo "Invalid typing fixture unexpectedly passed"
            exit 1
          fi
          grep -q 'invalid-assignment' ty-fixture.log
          grep -q 'missing-type-argument' ty-fixture.log
          grep -q 'unresolved-reference' ty-fixture.log
          grep -q 'invalid-return-type' ty-fixture.log
      - run: uv run pytest -q
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm lint:check
        working-directory: web
      - run: pnpm test
        working-directory: web
      - run: pnpm build
        working-directory: web
      - run: pnpm audit --audit-level low
        working-directory: web

  containers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configure smoke environment
        run: |
          cp .env.example .env
          sed -i 's/API_TOKEN=your-secret-token-here/API_TOKEN=ci-smoke-token/' .env
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build linux/amd64 images
        run: docker compose build
      - name: Verify SteamCMD on native amd64
        run: docker run --rm --platform linux/amd64 --entrypoint steamcmd dayz-server:latest-server +quit
      - name: Compose smoke test
        run: |
          docker compose up -d init api web
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null && curl --fail --silent http://127.0.0.1:8081/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs api web init
          exit 1
      - name: Scan repository
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          ignore-unfixed: true
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: 1
      - name: Reject high/critical repository findings, including unfixed
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          exit-code: 1
      - name: Scan API image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: dayz-server:latest-api
          ignore-unfixed: true
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: 1
      - name: Scan server image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: dayz-server:latest-server
          ignore-unfixed: true
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: 1
      - name: Scan web image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: dayz-server:latest-web
          ignore-unfixed: true
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: 1
      - name: Reject high/critical image findings, including unfixed
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: dayz-server:latest-api
          severity: HIGH,CRITICAL
          exit-code: 1
      - name: Reject high/critical server findings, including unfixed
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: dayz-server:latest-server
          severity: HIGH,CRITICAL
          exit-code: 1
      - name: Reject high/critical web findings, including unfixed
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: dayz-server:latest-web
          severity: HIGH,CRITICAL
          exit-code: 1
      - name: Tear down smoke stack
        if: always()
        run: docker compose down --volumes

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
