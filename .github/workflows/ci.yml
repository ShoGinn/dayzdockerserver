name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.5
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run ty check src
      - name: Verify strict ty diagnostics
        run: |
          if uv run ty check tests/typing_fixtures/invalid.py >ty-fixture.log 2>&1; then
            echo "Invalid typing fixture unexpectedly passed"
            exit 1
          fi
          grep -q 'invalid-assignment' ty-fixture.log
          grep -q 'missing-type-argument' ty-fixture.log
          grep -q 'unresolved-reference' ty-fixture.log
          grep -q 'invalid-return-type' ty-fixture.log
      - run: uv run pytest -q
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm lint:check
        working-directory: web
      - run: pnpm test
        working-directory: web
      - run: pnpm build
        working-directory: web
      - run: pnpm audit --audit-level low
        working-directory: web

  containers:
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure smoke environment
        run: |
          cp .env.example .env
          sed -i 's/API_TOKEN=your-secret-token-here/API_TOKEN=ci-smoke-token/' .env
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build linux/amd64 images
        run: docker compose build
      - name: Verify SteamCMD on native amd64
        run: docker run --rm --platform linux/amd64 --entrypoint steamcmd dayz-server:latest-server +quit
      - name: Compose smoke test
        run: |
          docker compose up -d init api web
          docker compose run --rm init | grep -q 'Volume ownership already initialized'
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null && curl --fail --silent http://127.0.0.1:8081/ >/dev/null; then
              headers="$(curl --fail --silent --dump-header - --output /dev/null http://127.0.0.1:8081/)"
              for header in content-security-policy permissions-policy referrer-policy x-content-type-options x-frame-options; do
                if ! grep -qi "^${header}:" <<<"${headers}"; then
                  echo "Missing required web security header: ${header}"
                  exit 1
                fi
              done
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs api web init
          exit 1
      - name: Scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          ignore-unfixed: true
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: 1
      - name: Reject high/critical repository findings, including unfixed
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          exit-code: 1
      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: dayz-server:latest-api
          ignore-unfixed: true
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: 1
      - name: Scan server image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: dayz-server:latest-server
          ignore-unfixed: true
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: 1
      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: dayz-server:latest-web
          ignore-unfixed: true
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: 1
      - name: Reject high/critical image findings, including unfixed
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: dayz-server:latest-api
          severity: HIGH,CRITICAL
          exit-code: 1
      - name: Reject high/critical server findings, including unfixed
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: dayz-server:latest-server
          severity: HIGH,CRITICAL
          exit-code: 1
      - name: Reject high/critical web findings, including unfixed
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: dayz-server:latest-web
          severity: HIGH,CRITICAL
          exit-code: 1
      - name: Tear down smoke stack
        if: always()
        run: docker compose down --volumes

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
