# =============================================================================
# DayZ Server - Docker Compose Configuration (Modernized)
# =============================================================================
# Best practices:
#   - Use compose spec v3.8+ features
#   - Named volumes with labels for better management
#   - Health checks with proper dependencies
#   - Resource limits
#   - Proper service ordering
# =============================================================================

name: dayz-server

volumes:
  homedir:
    name: dayz-homedir
    labels:
      com.dayz.description: "Shared home directory (Steam credentials)"
  serverfiles:
    name: dayz-serverfiles
    labels:
      com.dayz.description: "DayZ server installation"
  profiles:
    name: dayz-profiles
    labels:
      com.dayz.description: "Server profile (config, battleye, VPP)"
  mpmissions-upstream:
    name: dayz-mpmissions-upstream
    labels:
      com.dayz.description: "Upstream pristine mpmissions (read-only source)"
  control:
    name: dayz-control
    labels:
      com.dayz.description: "Control plane for API <-> Server communication"

services:
  init:
    image: alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    user: "0:0"
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /home/user/.steam /serverfiles/steamapps/workshop/content/221100 /serverfiles/keys /serverfiles/mpmissions /mpmissions-upstream /profiles/battleye /control
        chown -R "$${USER_ID}:$${GROUP_ID}" /home/user /serverfiles /mpmissions-upstream /profiles /control
        chmod 0770 /control
    environment:
      USER_ID: ${USER_ID:-1000}
      GROUP_ID: ${GROUP_ID:-1000}
    volumes:
      - homedir:/home/user
      - serverfiles:/serverfiles
      - mpmissions-upstream:/mpmissions-upstream
      - profiles:/profiles
      - control:/control
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER

  # ---------------------------------------------------------------------------
  # API container - management endpoints
  # ---------------------------------------------------------------------------
  api:
    platform: linux/amd64
    image: ${REGISTRY:-}dayz-server:${TAG:-latest}-api
    build:
      context: .
      target: api
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    volumes:
      - homedir:/home/user
      - serverfiles:/serverfiles
      - mpmissions-upstream:/mpmissions-upstream
      - profiles:/profiles
      - control:/control
      - type: bind
        source: ./files
        target: /files
        read_only: true
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    env_file:
      - path: .env
        required: true
    environment:
      # Override any env vars here if needed
      - PYTHONUNBUFFERED=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      com.dayz.service: "api"
      com.dayz.description: "Management API server"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"
        reservations:
          memory: 512m

  # ---------------------------------------------------------------------------
  # Server container - DayZServer process
  # ---------------------------------------------------------------------------
  server:
    platform: linux/amd64
    image: ${REGISTRY:-}dayz-server:${TAG:-latest}-server
    build:
      context: .
      target: server
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    depends_on:
      init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    volumes:
      - homedir:/home/user
      - serverfiles:/serverfiles
      - profiles:/profiles
      - control:/control
      - type: bind
        source: ./files
        target: /files
        read_only: true
    # Disable core dumps - DayZ crashes generate multi-GB dump files in /serverfiles
    # that are not useful for debugging and waste disk space. ulimits sets the max
    # core file size (in bytes); 0 = disabled.
    ulimits:
      core:
        soft: 0
        hard: 0
    # Host networking for LAN server browser visibility
    # Comment out and use ports below if you don't need LAN discovery
    network_mode: host
    # Uncomment for bridge networking (recommended for production)
    # ports:
    #   - "${GAME_PORT:-2302}:2302/udp"   # Game port
    #   - "${QUERY_PORT:-2303}:2303/udp"  # Steam query
    #   - "${STEAM_PORT:-27016}:27016/udp" # Steam master
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-m", "dayz.cli.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    env_file:
      - path: .env
        required: true
    environment:
      - PYTHONUNBUFFERED=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      com.dayz.service: "server"
      com.dayz.description: "DayZ game server"
    deploy:
      resources:
        limits:
          memory: ${SERVER_MEMORY_LIMIT:-8g}
          cpus: ${SERVER_CPU_LIMIT:-4}
        reservations:
          memory: ${SERVER_MEMORY_RESERVE:-4g}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Web UI - Nginx serving React app and proxying /api to backend
  # ---------------------------------------------------------------------------
  web:
    image: ${REGISTRY:-}dayz-server:${TAG:-latest}-web
    build:
      context: .
      target: web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8081}:8080"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8080/",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      com.dayz.service: "web"
      com.dayz.description: "Web UI frontend"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
        reservations:
          memory: 64m
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
